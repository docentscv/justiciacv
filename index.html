<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ofertas, adjudicaciones y tu posición en la bolsa de interinos de Justicia de la Comunitat Valenciana. Web independiente y no oficial.">
<title>JusticiaCV</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132857">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: una consulta rápida, con la "pulsación" semanal de la bolsa como motivo. Tinta azul marino sobre papel frío; los tres tipos de oferta tienen un color fijo en toda la app. */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --surface-2: #F7F9FD;
  --ink: #0D1B36;
  --muted: #5A6985;
  --line: #DAE1EC;
  --brand: #132857;
  --brand-ink: #FFFFFF;
  --tint: #E6ECF8;
  --c-vac: #2A78D6;
  --c-sus: #EB6834;
  --c-ref: #1BAF7A;
  --c-none: #BCC6D9;
  --ok: #17785A;
  --warn: #9A5B00;
  --bad: #B3261E;
  --shadow: 0 1px 2px rgba(13,27,54,.06), 0 8px 24px rgba(13,27,54,.06);
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1122; --surface: #111B33; --surface-2: #0E1730; --ink: #E8EEFA; --muted: #98A6C2; --line: #223054;
    --brand: #9DBBFF; --brand-ink: #0A1122; --tint: #172545;
    --c-vac: #3987E5; --c-sus: #D95926; --c-ref: #199E70; --c-none: #51638F; --ok: #4CCB9F; --warn: #F0B35A; --bad: #FF8F86;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1122; --surface: #111B33; --surface-2: #0E1730; --ink: #E8EEFA; --muted: #98A6C2; --line: #223054;
  --brand: #9DBBFF; --brand-ink: #0A1122; --tint: #172545;
  --c-vac: #3987E5; --c-sus: #D95926; --c-ref: #199E70; --c-none: #51638F; --ok: #4CCB9F; --warn: #F0B35A; --bad: #FF8F86;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 5.6vw, 46px); line-height: 1.05; font-weight: 800; letter-spacing: -.025em; }
h2 { font-size: clamp(20px, 3.4vw, 26px); line-height: 1.15; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) ; padding-inline: max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; letter-spacing: -.02em; font-size: 19px; white-space: nowrap; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.brand small { font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .02em; display: block; margin-top: -2px; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--tint); }
.tab[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.iconbtn { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--tint); }
.top-r { display: flex; align-items: center; gap: 8px; }
.acct { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.acctwrap { position: relative; }
.acct[aria-haspopup]::after { content: ''; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.acct[aria-expanded="true"]::after { transform: rotate(225deg) translateY(-2px); }
.acctmenu { position: absolute; right: 0; top: 46px; z-index: 60; min-width: 270px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(10, 17, 34, .18); padding: 8px; display: grid; gap: 2px; }
.acctmenu[hidden] { display: none; }
.acctmenu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; display: grid; gap: 2px; }
.acctmenu .who b { font-size: 15px; }
.acctmenu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.acctmenu button, .acctmenu a.mi { display: block; width: 100%; text-align: left; padding: 10px 10px; border-radius: 8px; background: none; border: 0; font: inherit; font-weight: 600; font-size: 14px; color: inherit; cursor: pointer; text-decoration: none; }
.acctmenu button:hover, .acctmenu a.mi:hover, .acctmenu button:focus-visible, .acctmenu a.mi:focus-visible { background: var(--tint); }
.acct:hover, .acct[aria-current="page"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
@media (max-width: 760px) {
  .top-in { flex-wrap: wrap; row-gap: 6px; }
  .tabs { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .tab { padding: 8px 9px; font-size: 13.5px; }
}
@media (max-width: 420px) {
  .tabs { gap: 0; }
  .tab { padding: 8px 5px; font-size: 13px; }
  .top-r { margin-left: auto; }
  .acct span { display: none; }
  .acct[aria-haspopup]::after { display: none; }
  .acct { width: 38px; padding: 0; justify-content: center; }
}

/* componentes */
main { padding-top: 22px; display: grid; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.card.flat { background: var(--surface-2); }
.card h3 + p, .card h2 + p { margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; text-decoration: none; cursor: pointer; min-height: 44px; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 6px 12px; border-radius: 10px; font-size: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; }
.chip:hover { background: var(--tint); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.d-vac { background: var(--c-vac); } .d-sus { background: var(--c-sus); } .d-ref { background: var(--c-ref); }
.mytop { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--tint); border: 2px solid transparent; }
.mytop > b { flex-basis: 100%; font-size: 17px; }
.mytop .pill { background: var(--surface); }
button.mytop { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.mytop[aria-pressed="true"] { border-color: var(--brand); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--brand-ink, var(--ink)); text-decoration: underline; cursor: pointer; }
.candck { display: flex; gap: 12px; align-items: flex-start; }
.candck input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.candck b { display: block; }
label.cand { cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--tint); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input, select.input { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; }
.hint { font-size: 13.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* inicio */
.hero { display: grid; gap: 22px; grid-template-columns: 1.15fr 1fr; align-items: stretch; padding-top: 8px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero-t { display: grid; gap: 16px; align-content: center; }
.lead { font-size: 18px; color: var(--muted); max-width: 52ch; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi b { display: block; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.seg { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); margin-top: 14px; }
.seg i { display: block; height: 100%; min-width: 3px; }
.seg .s-vac { background: var(--c-vac); } .seg .s-sus { background: var(--c-sus); } .seg .s-ref { background: var(--c-ref); }
.cycle { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 14px; }
.cycle > div { border-top: 3px solid var(--brand); padding-top: 8px; font-size: 14px; line-height: 1.4; }
.cycle b { display: block; }
.next-d { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }

/* ofertas */
.filters { display: grid; gap: 12px; }
.offers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.offer h3 { font-size: 15px; line-height: 1.3; font-weight: 650; }
.offer .where { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.offer .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.star { border: 0; background: none; cursor: pointer; padding: 4px; border-radius: 8px; line-height: 0; color: var(--muted); }
.star[aria-pressed="true"] { color: var(--c-sus); }
.star:hover { background: var(--tint); }

/* zonas */
.zrow { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 56px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.zrow:first-child { border-top: 0; }
.zname { display: flex; align-items: center; gap: 6px; min-width: 0; }
.zname button.lnk { border: 0; background: none; text-align: left; padding: 0; font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; min-width: 0; overflow-wrap: anywhere; }
.zname button.lnk:hover { text-decoration-color: var(--brand); }
.zbar { display: flex; height: 12px; gap: 2px; min-width: 0; }
.zbar i { display: block; height: 100%; border-radius: 3px; min-width: 3px; }
.zn { text-align: right; font-weight: 700; }
@media (max-width: 520px) { .zrow { grid-template-columns: 1fr 44px; } .zbar { grid-column: 1 / -1; grid-row: 2; } }

/* gráficos */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 10px; font-size: 13px; line-height: 1.35; box-shadow: var(--shadow); max-width: 230px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 700; }
.tip .tr { display: flex; justify-content: space-between; gap: 14px; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
.hbar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 10px; align-items: center; font-size: 14px; padding: 5px 0; }
.hbar .tr { height: 14px; border-radius: 4px; background: var(--tint); position: relative; overflow: hidden; }
.hbar .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.hbar b { text-align: right; }
@media (max-width: 480px) { .hbar { grid-template-columns: 96px 1fr 46px; } }

/* mi posición */
.verdict { font-size: 19px; line-height: 1.35; font-weight: 600; }
.verdict em { font-style: normal; color: var(--brand); font-weight: 800; }
.callout { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); background: var(--surface-2); }

/* guía */
details.acc { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 16px; }
details.acc + details.acc { margin-top: 10px; }
details.acc summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; font-size: 22px; font-weight: 500; color: var(--muted); line-height: 1; }
details.acc[open] summary::after { content: "–"; }
details.acc .body { padding: 0 0 16px; display: grid; gap: 10px; max-width: 68ch; color: var(--ink); }
.soon { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: 12px; }
.soon > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; }
.soon b { display: block; margin-bottom: 2px; }
.foot-note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.price-n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.price-n b { color: var(--brand); }
.grow { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.grow:first-of-type { border-top: 0; padding-top: 2px; }
.gh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
.gh b { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gbar { position: relative; height: 14px; border-radius: 4px; background: var(--tint); }
.gbar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.gbar u { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--c-sus); text-decoration: none; }
.alrt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 14px; }
.alrt input { margin-top: 3px; }
.steps3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.steps3 > div { border-top: 3px solid var(--brand); padding-top: 8px; font-size: 14px; line-height: 1.4; }
.steps3 b { display: block; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.msg { border-radius: 12px; padding: 10px 12px; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface-2); }
.msg.err { color: var(--bad); border-color: currentColor; font-weight: 600; }
.msg.ok { color: var(--ok); border-color: currentColor; font-weight: 600; }
.btn.danger { color: var(--bad); border-color: currentColor; }
.cand { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.cand b { display: block; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--brand); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 32px; }
.form { display: grid; gap: 12px; max-width: 420px; }
.note-top { margin-bottom: 14px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .tip { transition: none; } }

/* ---- Mapa ---- */
.mpf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
@media (min-width: 760px) { .mpf { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.map { position: relative; height: clamp(380px, 62vh, 640px); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #E3E8EF; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline-offset: 2px; }
.map.drag { cursor: grabbing; }
.mp-tiles, .mp-mk { position: absolute; inset: 0; overflow: hidden; }
.mp-mk { pointer-events: none; z-index: 1; }
.mp-t { position: absolute; left: 0; top: 0; width: 256px; height: 256px; max-width: none; transform-origin: 0 0; pointer-events: none; will-change: transform; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map { background: #1A2338; } :root:not([data-theme="light"]) .mp-t { filter: brightness(.7) contrast(1.1) saturate(.75); } }
:root[data-theme="dark"] .map { background: #1A2338; }
:root[data-theme="dark"] .mp-t { filter: brightness(.7) contrast(1.1) saturate(.75); }
.mp-m { position: absolute; left: 0; top: 0; border: 0; padding: 0; border-radius: 50%; cursor: pointer; pointer-events: auto; box-shadow: 0 0 0 2px var(--surface), 0 2px 8px rgba(13,27,54,.35); background: var(--c-none); }
.mp-m span { position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center; font: 700 12px/1 var(--font-mono); }
.mp-m.fav { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c-sus), 0 2px 8px rgba(13,27,54,.35); }
.mp-m.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--brand), 0 2px 10px rgba(13,27,54,.45); z-index: 3; }
.mp-m:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
